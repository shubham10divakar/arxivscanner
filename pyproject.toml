[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arxivscanner"
dynamic = ["version"]
description = "Fetch and display new arXiv papers for a domain or subdomain, from the terminal."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Subham Divakar", email = "shubham.divakar@gmail.com" }]
keywords = ["arxiv", "papers", "research", "rss", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shubham10divakar/arxivscanner"
Issues = "https://github.com/shubham10divakar/arxivscanner/issues"

[project.scripts]
arxivscanner = "arxivscanner.cli:main"

[tool.setuptools]
packages = ["arxivscanner"]

[tool.setuptools.dynamic]
version = { attr = "arxivscanner.__version__" }
