name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Offline: the tests use saved XML fixtures and never call arXiv.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Install the package and run the command
        shell: bash
        run: |
          python -m pip install .
          arxivscanner --version
          arxivscanner --list > /dev/null
          arxivscanner --from-file tests/fixtures/sample_rss.xml --no-color --short
          python -m arxivscanner --from-file tests/fixtures/sample_oai.xml --no-color --short
